/* Layout: one narrow reading column; summary strip first, then findings grouped by certainty. */
:root {
  --bg: #f4f5f3;
  --surface: #ffffff;
  --ink: #1b2326;
  --muted: #5b676b;
  --line: #d9dedb;
  --accent: #1f4e5f;
  --wrong: #a2362b;
  --wrong-bg: #f8e4e1;
  --open: #8a6200;
  --open-bg: #f6ecd0;
  --ok: #2d6a45;
  --ok-bg: #dfeee4;
  --art-bg: #e9ece8;
  --art-a: #b4c1c8;
  --art-b: #d2764b;
  --art-band: #9c2f26;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14191b;
    --surface: #1c2326;
    --ink: #e6ebe9;
    --muted: #9aa6a9;
    --line: #2f3a3e;
    --accent: #7fc0d6;
    --wrong: #f0988d;
    --wrong-bg: #3a2220;
    --open: #e5c066;
    --open-bg: #38301a;
    --ok: #86c9a0;
    --ok-bg: #1d3226;
    --art-bg: #10161a;
    --art-a: #34444c;
    --art-b: #9a5a3b;
    --art-band: #7a2a24;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.55;
}
.wrap { max-width: 1040px; margin: 0 auto; padding: 22px 20px 72px; }
header h1 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(30px, 6vw, 42px);
  line-height: 1.1;
  margin: 0 0 10px;
  text-wrap: balance;
}
header p { margin: 0; color: var(--muted); max-width: 62ch; }
.meta { margin-top: 14px; font-size: 14px; color: var(--muted); }

.summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  margin: 28px 0 8px;
}
.tile {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left-width: 4px;
  border-radius: 6px;
  padding: 12px 14px;
}
.tile b { display: block; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile span { font-size: 14px; color: var(--muted); }
.tile.wrong { border-left-color: var(--wrong); }
.card { border-left-width: 4px; }
.card[data-s="wrong"] { border-left-color: var(--wrong); }
.card[data-s="open"] { border-left-color: var(--open); }
.card[data-s="ok"] { border-left-color: var(--ok); }
.cite-l strong { color: var(--ink); font-weight: 700; }
.tile.open { border-left-color: var(--open); }
.tile.ok { border-left-color: var(--ok); }
.tile.new { border-left-color: var(--muted); }
button.tile { font: inherit; color: inherit; text-align: left; cursor: pointer; }
button.tile:hover { border-color: var(--accent); }
button.tile[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 1px; }
button.tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.cite { margin: 12px 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.cite-h { margin: 0 0 6px; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.cite blockquote { margin: 0 0 6px; border-left: 3px solid var(--accent); padding-left: 12px; color: var(--ink); }
.cite-l { margin: 0; font-size: 14px; color: var(--muted); }
.cite.src ul { margin: 0; padding-left: 20px; }

h2 {
  font-family: var(--font-display);
  font-size: 24px;
  margin: 44px 0 6px;
  text-wrap: balance;
}
.lede { color: var(--muted); margin: 0 0 16px; max-width: 62ch; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 28px 0 0; }
.filters button {
  font: inherit;
  font-size: 15px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 14px;
  cursor: pointer;
}
.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.filters button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px 18px;
  margin: 0 0 14px;
}
.card h3 { font-size: 22px; font-weight: 700; margin: 6px 0 2px; line-height: 1.25; }
.card .topic { margin: 0 0 4px; font-size: 16px; font-weight: 600; color: var(--ink); }
.who { font-size: 15px; color: var(--muted); margin: 0 0 8px; }
.card p { margin: 0 0 10px; }
.card p:last-child { margin-bottom: 0; }
.pill {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  padding: 2px 9px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.pill.wrong { background: var(--wrong-bg); color: var(--wrong); }
.pill.open { background: var(--open-bg); color: var(--open); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.new { background: var(--line); color: var(--muted); }
.claim { border-left: 3px solid var(--line); padding-left: 12px; color: var(--ink); }
.facts { font-size: 15px; color: var(--muted); }
.facts strong { color: var(--ink); }

.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
td.bad { color: var(--wrong); text-decoration: line-through; text-decoration-thickness: 1px; }

.limits { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 18px; }
.limits ul { margin: 8px 0 0; padding-left: 20px; }
.limits li { margin-bottom: 6px; }

.sources { font-size: 15px; padding-left: 20px; }
.sources li { margin-bottom: 4px; }
a { color: var(--accent); }
footer { margin-top: 44px; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }

.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0 0; }
.tools input[type="search"], .tools select {
  font: inherit; font-size: 15px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; min-width: 0;
}
.tools input[type="search"] { flex: 1 1 220px; }
.tools select { flex: 0 1 190px; }
.tools input:focus-visible, .tools select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tools label { font-size: 14px; color: var(--muted); }
.status { margin: 14px 0 0; font-size: 14px; color: var(--muted); min-height: 1.5em; }
.status button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 20px; margin-top: 16px; color: var(--muted); text-align: center; }
.sec-head h2 { margin-top: 32px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Flokkayfirlit: stöplar með áferð svo staða ráðist ekki af lit einum (rautt/grænt). */
.byparty { margin-top: 36px; }
.byparty h2 { margin-top: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0 0 14px; padding: 0; list-style: none; font-size: 14px; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 7px; }
.sw { display: inline-block; width: 22px; height: 10px; border-radius: 3px; }
.seg-wrong { background: var(--wrong); }
.seg-open { background: repeating-linear-gradient(135deg, var(--open) 0 3px, var(--open-bg) 3px 6px); box-shadow: inset 0 0 0 1px var(--open); }
.seg-ok { background: radial-gradient(circle, var(--ok) 1.4px, transparent 1.6px) 0 0 / 6px 6px, var(--ok-bg); box-shadow: inset 0 0 0 1px var(--ok); }
.prow { padding: 10px 0; border-top: 1px solid var(--line); }
.prow:first-of-type { border-top: 0; }
.pbtn { text-decoration: none; font: inherit; font-weight: 600; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.pbtn:hover { color: var(--accent); text-decoration: underline; }
.pbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.pbar { display: flex; gap: 2px; height: 12px; margin: 6px 0 4px; }
.pbar i { display: block; border-radius: 2px; min-width: 6px; }
.pbar i:first-child { border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
.pbar i:last-child { border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
.pcount { margin: 0; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pcount b { color: var(--ink); font-weight: 700; }

/* Aðferð og skýringar */
.method dl { margin: 0 0 16px; }
.method dt { font-weight: 700; margin-top: 12px; }
.method dd { margin: 2px 0 0; color: var(--muted); max-width: 62ch; }
.method ol { padding-left: 20px; margin: 0; max-width: 62ch; }
.method li { margin-bottom: 6px; }
.permalink { font-size: 13px; color: var(--muted); margin-left: 8px; text-decoration: none; }
.permalink:hover { color: var(--accent); text-decoration: underline; }
.card:target { outline: 3px solid var(--accent); outline-offset: 2px; }
.card { scroll-margin-top: 16px; }
.how { margin: 10px 0 0; font-size: 15px; }

/* Dagskrá þingfundar */
.agenda { margin-top: 28px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 14px 18px 8px; }
.agenda h2 { margin: 0 0 4px; font-size: 22px; }
.agenda .lede { margin-bottom: 8px; }
.ag-list { margin: 0; padding-left: 26px; }
.ag-list li { padding: 8px 0; border-top: 1px solid var(--line); }
.ag-list li::marker { color: var(--muted); font-variant-numeric: tabular-nums; }
.ag-t { display: block; font-weight: 600; }
.ag-topic { font-weight: 400; color: var(--muted); }
.ag-m { display: block; font-size: 14px; color: var(--muted); }

.skip { position: absolute; left: 12px; top: -48px; background: var(--accent); color: var(--bg); padding: 8px 14px; border-radius: 6px; z-index: 10; }
.skip:focus { top: 12px; }
.hint { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
@media print {
  :root { --bg: #fff; --surface: #fff; --ink: #000; --muted: #333; --line: #bbb; }
  .topbar { display: none !important; }
  .duo, .results { display: block; }
  .art-arches, .art-band { display: none !important; }
  .filters, .tools, .status, .empty, .skip, .permalink, .how, .hint, .pbtn:after { display: none !important; }
  .hidden { display: block !important; }
  body { font-size: 12pt; }
  .wrap { max-width: none; padding: 0; }
  .card, .agenda, .cite { break-inside: avoid; }
  a { color: inherit; text-decoration: underline; }
}

/* Forsíðuborð: líklega rangt til vinstri, dagskrá þingsins til hægri */
.hero { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; margin-top: 28px; align-items: stretch; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }
.hero-main, .hero .agenda { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 22px; margin: 0; }
.hero .agenda { border-left-width: 1px; display: flex; flex-direction: column; }
.hero .agenda .ag-list { overflow-y: auto; max-height: 460px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip { font: inherit; font-size: 13px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 7px 12px; cursor: pointer; }
.chip[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.hero-sub { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
.hero-item { padding: 12px 0; border-top: 1px solid var(--line); }
.hero-item:first-of-type { border-top: 0; padding-top: 0; }
.hero-date { margin: 0 0 4px; font-size: 14px; font-weight: 600; color: var(--accent); }
.hero-item h3 { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.25; margin: 0 0 6px; text-wrap: balance; }
.hero-quote { margin: 0 0 6px; color: var(--muted); }
.hero-more { margin: 0; font-weight: 600; }
.hero-none { margin: 8px 0 12px; font-size: 18px; max-width: 46ch; }
.hero-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.hero-foot a { font-weight: 600; }

/* Skraut: bogamynstur og ofið band, teiknað sem SVG (engar utanaðkomandi myndir) */
.art-arches path { fill: none; stroke-width: 1.5; }
.arc-a { stroke: var(--art-a); }
.arc-b { stroke: var(--art-b); }
.rib-a { stroke: var(--art-band); stroke-width: 9; fill: none; }
.rib-b { stroke: var(--art-bg); stroke-width: 2; fill: none; }

/* Yfirbragð: efsta stika, stórar tölur, tveggja dálka uppsetning */
[id] { scroll-margin-top: 76px; }
.topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: 0 2px 14px rgba(20, 40, 50, .07); }
.topbar-in { max-width: 1040px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; gap: 8px 24px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; color: var(--accent); text-decoration: none; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; font-size: 15px; }
.topbar nav { display: flex; gap: 4px 20px; flex-wrap: wrap; }
.topbar nav a { color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 600; padding: 6px 0; border-bottom: 2px solid transparent; }
.topbar nav a:hover { border-bottom-color: var(--accent); }
.topbar a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
header { padding-top: 8px; }
.intro { font-size: 20px; line-height: 1.5; color: var(--ink); max-width: 56ch; margin: 18px 0 0; }
.meta { margin-top: 8px; }
.how { margin-top: 6px; }

.hero-main, .hero .agenda, .tile, .card, .byparty, .limits { box-shadow: 0 1px 2px rgba(20, 40, 50, .05), 0 10px 28px -12px rgba(20, 40, 50, .18); }
.hero-main, .hero .agenda { padding: 22px 26px; }

.hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0 0; padding-top: 16px; border-top: 1px solid var(--line); }
.hero-stats div { text-align: center; }
.hero-stats b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 40px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.hero-stats span { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.hero-stats .w b { color: var(--wrong); } .hero-stats .o b { color: var(--open); } .hero-stats .k b { color: var(--ok); }

.summary { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin: 24px 0 0; }
@media (max-width: 760px) { .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { text-align: center; padding: 20px 14px 18px; border-radius: 12px; border-left-width: 1px; border-top: 4px solid var(--muted); }
.tile.wrong { border-top-color: var(--wrong); border-left-color: var(--line); }
.tile.open { border-top-color: var(--open); border-left-color: var(--line); }
.tile.ok { border-top-color: var(--ok); border-left-color: var(--line); }
.tile.new { border-top-color: var(--muted); border-left-color: var(--line); }
.tile .tile-l { display: block; font-size: 13px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink); }
.tile b { font-family: var(--font-display); font-weight: 600; font-size: 56px; line-height: 1.1; margin: 8px 0 6px; }
.tile .tile-c { font-size: 13px; }

.duo { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; margin-top: 40px; align-items: start; }
@media (max-width: 900px) { .duo { grid-template-columns: 1fr; } }
.duo .byparty { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; }
.duo .limits { border-radius: 12px; padding: 20px 24px; font-size: 15px; }

.results { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
@media (max-width: 900px) { .results { grid-template-columns: 1fr; } }
.results .sec-head { grid-column: 1 / -1; }
.results .card { margin: 0; }
.card:target { scroll-margin-top: 84px; }

/* Minimalismi: færri kassar, meira loft, hlekkir í stað langs texta */
a.tile { display: block; color: var(--ink); text-decoration: none; }
a.tile:hover { border-color: var(--accent); }
.page-h { font-family: var(--font-display); font-weight: 600; font-size: clamp(28px, 5vw, 38px); margin: 24px 0 18px; }
.more { margin: 14px 0 0; font-weight: 600; }
.more a { text-decoration: none; }
.more a:hover { text-decoration: underline; }
.note { margin: 14px 0 0; font-size: 14px; color: var(--muted); }
.topbar nav a[aria-current="page"] { border-bottom-color: var(--accent); }
.byparty { max-width: 720px; box-shadow: none; background: none; border: 0; padding: 0; margin: 0; }
.method { max-width: 62ch; }
.limits { max-width: 62ch; margin-top: 28px; box-shadow: none; background: none; border: 0; padding: 0; }
.limits h2 { margin: 0 0 6px; font-size: 22px; }
.meta { text-align: center; margin: 28px 0 0; }
.hero-main, .hero .agenda { box-shadow: none; }
.hero .agenda .ag-list { max-height: none; }
.summary { margin-top: 28px; }
.tile { box-shadow: none; }
.hero-item h3 { font-size: 24px; }

.chip-logo { display: inline-flex; align-items: center; gap: 10px; padding: 6px 12px; min-height: 40px; }
.plogo { display: block; height: 26px; width: auto; max-width: 64px; object-fit: contain; }
.pbadge { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 26px; padding: 0 6px; border: 1.5px solid currentColor; border-radius: 5px; font-size: 14px; font-weight: 700; letter-spacing: .02em; text-transform: none; }

/* Mynstrið nær yfir alla síðuna: fast bakgrunnsmynstur, efni á hvítum flötum ofan á */
.art-arches { position: fixed; inset: 0; top: 0; width: 100%; height: 100%; z-index: -2; opacity: .4; pointer-events: none; }
.band { position: relative; height: 26px; background: var(--bg); border-bottom: 1px solid var(--art-band); overflow: hidden; }
.band .art-band { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
.page-h, .sec-head h2, .meta, .status, footer { background: var(--bg); padding: 4px 14px; border-radius: 12px; display: inline-block; }
footer { display: block; border-radius: 12px; margin-top: 44px; border-top: 0; }
.meta { display: block; width: fit-content; margin: 28px auto 0; }
.sec-head { margin: 8px 0 -4px; }
.sec-head h2 { margin: 24px 0 0; }
.wrap { padding-top: 32px; }

/* Formin líka í haus: mynstur á stikunni og bandið fest við hana */
.topbar { overflow: visible; }
.art-top { position: absolute; inset: 0; width: 100%; height: calc(100% - 26px); opacity: .35; pointer-events: none; }
.topbar-in { position: relative; }
.topbar .brand, .topbar nav { background: var(--surface); padding: 4px 12px; border-radius: 10px; }
[id] { scroll-margin-top: 112px; }

/* Staðfest rangt er áberandi umfram líklega rangt */
.pill.confirmed { background: var(--wrong); color: var(--surface); font-size: 13px; padding: 4px 12px; letter-spacing: .06em; }
.card[data-confirmed] { border: 2px solid var(--wrong); border-left-width: 8px; background: linear-gradient(var(--wrong-bg), var(--surface) 110px); }
.tile.confirmed { border-top: 6px solid var(--wrong); background: var(--wrong); }
.tile.confirmed .tile-l, .tile.confirmed b { color: var(--surface); }
.tile.confirmed:hover { border-color: var(--wrong); filter: brightness(1.05); }
.summary { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.hero-stats { grid-template-columns: repeat(4, 1fr); }
.hero-stats .c b { color: var(--wrong); }
.hero-stats .c span { color: var(--wrong); }
.hero-stats .w b { opacity: .75; }

/* Styttri spjöld: engir innri kassar, hlekkir í einni línu */
.card { padding: 14px 18px; }
.card h3 { font-size: 18px; margin: 4px 0 0; }
.card .who { margin: 0 0 6px; }
.card .topic { margin: 0 0 6px; font-size: 16px; }
.q { margin: 0 0 6px; padding-left: 12px; border-left: 3px solid var(--accent); color: var(--ink); }
.links { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
.facts { margin: 0; font-size: 15px; }
.facts details { display: inline; }
.facts summary { display: inline; cursor: pointer; color: var(--accent); font-weight: 600; }
.facts details[open] summary { display: block; margin-top: 4px; }

/* Flokksbókstafir: aðeins stafirnir í lit flokksins, engin box */
.chip-logo, .chip-logo[aria-selected="true"] { background: #1b2326; border: 2px solid transparent; opacity: .6; }
.chip-logo[aria-selected="true"] { opacity: 1; border-color: var(--accent); }
.pbadge { min-width: 0; height: auto; padding: 0; border: 0; background: none; font-size: 19px; font-weight: 700; letter-spacing: .01em; }
.hidden { display: none; }
@media (prefers-reduced-motion: no-preference) { .filters button { transition: background .15s; } }
</style>
</head>

<div class="topbar"><svg class="art-top" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="url(#arch)"/></svg><div class="topbar-in">
  <a class="brand" href="index.html"><svg viewBox="0 0 64 64" width="34" height="34" aria-hidden="true" focusable="false"><rect width="64" height="64" rx="14" fill="currentColor"/><path d="M16 34l12 12 22-26" fill="none" stroke="var(--surface)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Staðreyndavakt Alþingis</span></a>

{{MAIN}}

<script>
(function () {
  if (!document.getElementById('q')) return;
  var buttons = document.querySelectorAll('[data-f]');
  var cards = Array.prototype.slice.call(document.querySelectorAll('.card[data-s]'));
  var heads = Array.prototype.slice.call(document.querySelectorAll('.sec-head'));
  var q = document.getElementById('q');
  var party = document.getElementById('party');
  var status = document.getElementById('status');
  var empty = document.getElementById('empty');
  var pbtns = document.querySelectorAll('[data-p]');
  var state = {f: 'all', q: '', p: ''};

  function norm(t) { return (t || '').toLowerCase(); }

  function readHash() {
    var params = new URLSearchParams(location.hash.replace(/^#/, ''));
    state.f = params.get('f') || 'all';
    state.q = params.get('q') || '';
    state.p = params.get('p') || '';
    if (!document.querySelector('[data-f="' + state.f + '"]')) state.f = 'all';
    q.value = state.q;
    party.value = state.p;
    if (party.value !== state.p) state.p = '';
  }

  function writeHash() {
    var params = new URLSearchParams();
    if (state.f !== 'all') params.set('f', state.f);
    if (state.q) params.set('q', state.q);
    if (state.p) params.set('p', state.p);
    var h = params.toString();
    // Ekki skrifa yfir akkeri (#adferd, #seed-1) nema sía sé virk.
    if (!h && location.hash.indexOf('=') === -1) return;
    history.replaceState(null, '', h ? '#' + h : location.pathname + location.search);
  }

  function apply() {
    var needle = norm(state.q).trim();
    var shown = 0;
    buttons.forEach(function (x) { x.setAttribute('aria-pressed', x.getAttribute('data-f') === state.f ? 'true' : 'false'); });
    cards.forEach(function (c) {
      var ok = (state.f === 'all' || c.getAttribute('data-s') === state.f)
        && (!state.p || c.getAttribute('data-party') === state.p)
        && (!needle || (c.getAttribute('data-search') || '').indexOf(needle) !== -1);
      c.classList.toggle('hidden', !ok);
      if (ok) shown++;
    });
    heads.forEach(function (h) {
      var s = h.getAttribute('data-sec');
      var any = cards.some(function (c) { return c.getAttribute('data-s') === s && !c.classList.contains('hidden'); });
      h.classList.toggle('hidden', !any);
    });
    var filtered = state.f !== 'all' || state.p || needle;
    status.textContent = filtered ? 'Sýni ' + shown + ' af ' + cards.length + ' fullyrðingum.' : '';
    empty.classList.toggle('hidden', shown !== 0);
    writeHash();
  }

  buttons.forEach(function (b) {
    b.addEventListener('click', function () {
      state.f = b.getAttribute('data-f');
      if (b.classList.contains('tile')) { var fl = document.querySelector('.filters'); if (fl) fl.scrollIntoView({behavior: 'smooth', block: 'start'}); }
      apply();
    });
  });
  pbtns.forEach(function (b) {
    b.addEventListener('click', function () {
      state.p = b.getAttribute('data-p'); party.value = state.p;
      var fl = document.querySelector('.filters'); if (fl) fl.scrollIntoView({behavior: 'smooth', block: 'start'});
      apply();
    });
  });
  q.addEventListener('input', function () { state.q = q.value; apply(); });
  party.addEventListener('change', function () { state.p = party.value; apply(); });
  document.getElementById('reset').addEventListener('click', function () {
    state = {f: 'all', q: '', p: ''}; q.value = ''; party.value = ''; apply();
  });
  window.addEventListener('hashchange', function () {
    if (location.hash.indexOf('=') !== -1 || location.hash === '') { readHash(); apply(); }
  });
  readHash();
  apply();
})();
</script>
<script>
(function () {
  var sec = document.getElementById('dagskra'), label = document.getElementById('ag-label');
  if (!sec || !label) return;
  // Dagsetning í Reykjavík (UTC) svo fyrirsögnin passi þótt síðan hafi ekki verið endurgerð í dag
  var today = new Date().toISOString().slice(0, 10), d = sec.getAttribute('data-date');
  label.textContent = d === today ? 'Dagskrá Alþingis í dag' : (d > today ? 'Næsti þingfundur' : 'Síðasti þingfundur');
})();
</script>
<script>
(function () {
  var tabs = document.querySelectorAll('.chip[data-tab]');
  tabs.forEach(function (t) {
    t.addEventListener('click', function () {
      tabs.forEach(function (x) {
        var on = x === t;
        x.setAttribute('aria-selected', on ? 'true' : 'false');
        document.getElementById('hp-' + x.getAttribute('data-tab')).classList.toggle('hidden', !on);
      });
    });
  });
})();
</script>
