name: Daglegt staðreyndapróf

on:
  schedule:
    - cron: "23 7 * * *"        # á hverjum degi kl. 07:23 UTC
    - cron: "40 14-23 * * 1-5"  # mán-fös á klukkutíma fresti frá kl. 14:40 til 23:40 (þingfundir hefjast kl. 13:30)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sækja, prófa og endurgera síðuna
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.run
      - name: Vista breytingar
        run: |
          git config user.name "staðreyndavakt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "Engar breytingar."
          else
            git commit -m "Dagleg uppfærsla $(date -u +%F)"
            git push
          fi
